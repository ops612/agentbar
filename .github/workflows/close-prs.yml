# This repo doesn't accept pull requests — contributions come in as Prompt
# issues instead (see CONTRIBUTING.md). This closes incoming PRs with a
# pointer to the issue template. pull_request_target is safe here because
# the job never checks out or runs PR code.
name: Close pull requests
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thanks for the interest! AgentBar doesn't take pull requests — the code is written by an agent.",
              "",
              `Got a feature idea or a fix? [Open a Prompt issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?template=prompt.yml) with the prompt you'd give the agent, and good ones get run against the codebase and shipped.`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed",
            });
